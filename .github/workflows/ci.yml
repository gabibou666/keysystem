name: CI

# Garde-fou: empeche de deployer une regression silencieuse.
# (Rappel: ce workflow n'est PAS le keep-alive — voir keepalive.yml.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Qualite + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation
        working-directory: server
        run: npm ci

      - name: Verification assets / CSP / syntaxe / echappement
        working-directory: server
        run: npm run check

      - name: Tests de securite (chiffrement, cles, configuration)
        working-directory: server
        run: npm test

      - name: Audit des dependances (informatif)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Smoke test (demarrage sans base de donnees)
        working-directory: server
        env:
          NODE_ENV: development
          PORT: '3100'
          PUBLIC_URL: http://localhost:3100
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/none
          SCHEDULERS: 'off'
        run: |
          node src/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:3100/; then break; fi
            sleep 1
          done

          fail=0
          check() { # url, motif
            body=$(curl -s -m 10 "$1" || true)
            if echo "$body" | grep -q "$2"; then
              echo "OK   $1"
            else
              echo "FAIL $1 (motif '$2' absent)"; fail=1
            fi
          }

          check http://localhost:3100/            '<title>AUDIT HUB'
          check http://localhost:3100/getkey      'Get a Free Key'
          check http://localhost:3100/robots.txt  'Sitemap:'
          check http://localhost:3100/sitemap.xml '<urlset'
          check http://localhost:3100/style.css   '@font-face'
          check http://localhost:3100/app-index.js 'tickerEvents'

          # /healthz doit repondre: 200 si la DB est joignable, 503 sinon (attendu ici)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/healthz)
          echo "healthz -> $code"
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then echo "FAIL healthz ($code)"; fail=1; fi

          echo "--- journal serveur ---"; tail -25 /tmp/server.log
          exit $fail
