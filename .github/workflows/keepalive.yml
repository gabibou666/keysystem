name: Keep Render awake

# ROLE: filet de securite pour REVEILLER le service apres un redemarrage/
# redeploiement Render (le self-ping serveur ne traverse pas un spin-up).
# Cadence: 30 min -> ~1440 min Actions/mois, sous la limite GitHub Free (2000).

on:
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 minutes (UTC)
  workflow_dispatch:          # bouton "Run workflow" dans l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake / keep-alive KeySystem
        run: |
          URL="https://keysystem-vv8b.onrender.com/api/stats/public"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 90 --retry 2 --retry-delay 10 "$URL")
          echo "[$(date -u '+%Y-%m-%d %H:%M UTC')] keep-alive -> HTTP $code"
          # Toujours reussir: un ping rate ne doit pas spammer d'emails d'echec
          exit 0
