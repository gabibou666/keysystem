<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1233"/>
      <stop offset="50%" stop-color="#0f0b1c"/>
      <stop offset="100%" stop-color="#07050d"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Gold & Neon Key Gradient -->
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.8" flood-color="#a855f7" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#fde047" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Rounded Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="2.5"/>

  <!-- Glowing Key -->
  <g filter="url(#glow)">
    <!-- Key Bow (Ring) -->
    <circle cx="23" cy="23" r="10.5" fill="none" stroke="url(#goldKey)" stroke-width="4.2"/>
    <!-- Keyhole Center Cutout -->
    <circle cx="23" cy="23" r="3.2" fill="#0f0b1c" stroke="url(#goldKey)" stroke-width="1.8"/>

    <!-- Key Shaft -->
    <line x1="31" y1="31" x2="49" y2="49" stroke="url(#goldKey)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- First Bit / Notch -->
    <line x1="41" y1="41" x2="46" y2="36" stroke="url(#goldKey)" stroke-width="3.8" stroke-linecap="round"/>

    <!-- Tip Bit / Notch -->
    <line x1="47" y1="47" x2="52" y2="42" stroke="url(#goldKey)" stroke-width="3.8" stroke-linecap="round"/>
  </g>

  <!-- Sparkle Accent -->
  <g opacity="0.9">
    <circle cx="49" cy="15" r="1.8" fill="#ffffff"/>
    <line x1="49" y1="11" x2="49" y2="19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="45" y1="15" x2="53" y2="15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
