<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <a class="logo" href="/" style="text-decoration:none;color:inherit"><div class="logo-badge">🔑</div> KeySystem</a>
  <div class="links">
    <a href="/">Home</a>
    <a href="/getkey">Get a key</a>
  </div>
</nav>

<main>
  <section class="hero" style="padding-bottom: 30px;">
    <h1>Changelog</h1>
    <p>What changed in each published version of the script.</p>
  </section>

  <section style="max-width: 680px; margin: 0 auto; padding: 0 24px 40px;">
    <div id="list"><p style="color: var(--muted);">Loading…</p></div>
  </section>
</main>

<footer>
  Powered by LootLabs · <a href="/">Home</a>
</footer>

<script>
fetch('/api/admin/changelog')
  .then(r => r.json())
  .then(d => {
    const list = document.getElementById('list');
    if (!d.versions || !d.versions.length) {
      list.innerHTML = '<p style="color: var(--muted);">No published versions yet.</p>';
      return;
    }
    list.innerHTML = d.versions.map(v => `
      <div class="card" style="margin-bottom: 14px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <span style="font-size: 19px; font-weight: 700; color: var(--accent);">v${v.version}</span>
          <span style="color: var(--muted); font-size: 13px;">${new Date(v.created_at).toLocaleDateString('en-US')}</span>
        </div>
        <p style="margin-top: 10px; line-height: 1.6;">${(v.note || '').replace(/</g, '&lt;').replace(/\n/g, '<br>')}</p>
      </div>
    `).join('');
  })
  .catch(() => document.getElementById('list').innerHTML = '<p style="color: var(--muted);">Failed to load.</p>');
</script>
<script src="/effects.js"></script>
</body>
</html>
