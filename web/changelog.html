<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <a class="logo" href="/" style="text-decoration:none;color:inherit"><div class="logo-badge">🔑</div> KeySystem</a>
  <div class="links" id="navLinks">
    <a href="/">Home</a>
    <a href="/getkey">Get a key</a>
    <a href="/robux">Pay with Robux</a>
  </div>
  <button class="nav-hamburger" id="navHamburger" onclick="toggleNav()">
    <span></span><span></span><span></span>
  </button>
</nav>

<main>
  <section class="hero-mini">
    <h1>Changelog</h1>
    <p>What changed in each published version of the script.</p>
  </section>

  <!-- AD: Leaderboard 728x90 -->
  <div class="ad-banner leaderboard" id="ad-leaderboard-changelog" style="max-width: 728px;">
    <script>atOptions = { key: '77389bd3deefc49e2ab9e702f1a05cbb', format: 'iframe', height: 90, width: 728, params: {} };</script>
    <script src="https://www.highrevenueformat.com/77389bd3deefc49e2ab9e702f1a05cbb/invoke.js"></script>
  </div>

  <section style="max-width: 680px; margin: 0 auto; padding: 0 24px 60px;">
    <div id="list"><div class="skel" style="min-height: 120px;"></div></div>
  </section>

  <!-- AD: In-content 728x90 -->
  <div class="ad-banner in-content" id="ad-content-changelog" style="max-width: 728px;">
    <script>atOptions = { key: '77389bd3deefc49e2ab9e702f1a05cbb', format: 'iframe', height: 90, width: 728, params: {} };</script>
    <script src="https://www.highrevenueformat.com/77389bd3deefc49e2ab9e702f1a05cbb/invoke.js"></script>
  </div>
</main>

<footer>
  Powered by LootLabs · <a href="/">Home</a>
</footer>

<script>
function toggleNav() {
  document.getElementById('navLinks').classList.toggle('open');
  document.getElementById('navHamburger').classList.toggle('open');
}
document.querySelectorAll('#navLinks a').forEach(a => {
  a.addEventListener('click', () => {
    document.getElementById('navLinks').classList.remove('open');
    document.getElementById('navHamburger').classList.remove('open');
  });
});

fetch('/api/admin/changelog')
  .then(r => r.json())
  .then(d => {
    const list = document.getElementById('list');
    if (!d.versions || !d.versions.length) {
      list.innerHTML = '<p style="color: var(--muted); text-align:center; padding:40px 0;">No published versions yet.</p>';
      return;
    }
    list.innerHTML = d.versions.map((v, i) => `
      <div class="card reveal" style="margin-bottom: 14px; animation-delay: ${i * 0.06}s;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
          <span style="font-size: 19px; font-weight: 700; background: linear-gradient(135deg, #d8b4fe, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">v${v.version}</span>
          <span style="color: var(--muted); font-size: 13px;">${new Date(v.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
        </div>
        <p style="margin-top: 10px; line-height: 1.7; color: var(--muted);">${(v.note || '').replace(/</g, '&lt;').replace(/\n/g, '<br>')}</p>
      </div>
    `).join('');

    // Trigger reveal animation
    list.querySelectorAll('.reveal').forEach(el => {
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }});
      }, { threshold: 0.12 });
      io.observe(el);
    });
  })
  .catch(() => document.getElementById('list').innerHTML = '<p style="color: var(--muted); text-align:center;">Failed to load.</p>');
</script>
<script src="/effects.js"></script>
<script src="/ads.js"></script>
<script src="/guard.js"></script>
</body>
</html>
